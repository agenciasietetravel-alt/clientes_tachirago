/* ============================================================  
   FIX CRÍTICO MÓVIL: evita el desbordamiento horizontal de TODA  
   la página. Sin esto, cualquier elemento que exceda por unos  
   pocos píxeles el ancho del viewport (inputs de fecha, filas de  
   tabs, cards de ancho fijo, etc.) hace que el navegador permita  
   scrollear horizontalmente la página COMPLETA, cortando textos  
   y desalineando todo — exactamente el bug reportado.  
   ============================================================ */  
html, body {  
  max-width: 100%;  
  overflow-x: hidden;  
}  
#root {  
  overflow-x: hidden;  
  width: 100%;  
}  
* {  
  min-width: 0;  
}

html { scroll-behavior: smooth; }  
::-webkit-scrollbar { height: 8px; width: 8px; }  
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }  
.line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }  
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }  
.animated-gradient-text {  
  background: linear-gradient(90deg, #FF6B00, #0052CC, #FF6B00);  
  background-size: 200% auto;  
  -webkit-background-clip: text;  
  background-clip: text;  
  color: transparent;  
  animation: shine 3s linear infinite;  
}  
@keyframes shine { to { background-position: -200% center; } }

@keyframes sway-soft {  
  0%,100% { transform: rotate(-1.2deg) translateX(0); }  
  50%     { transform: rotate(1.2deg) translateX(4px); }  
}  
@keyframes sway-medium {  
  0%,100% { transform: rotate(-2deg) translateX(-3px); }  
  50%     { transform: rotate(2.2deg) translateX(3px); }  
}  
@keyframes sway-strong {  
  0%,100% { transform: rotate(-2.8deg) skewX(-1deg); }  
  50%     { transform: rotate(2.8deg) skewX(1deg); }  
}  
.veg-far   { transform-origin: bottom center; animation: sway-soft 7s ease-in-out infinite; will-change: transform; }  
.veg-mid   { transform-origin: bottom center; animation: sway-medium 5.5s ease-in-out infinite; will-change: transform; }  
.veg-front { transform-origin: bottom center; animation: sway-strong 4.5s ease-in-out infinite; will-change: transform; }

@keyframes kenburns {  
  0%   { transform: scale(1) translate(0, 0); }  
  50%  { transform: scale(1.08) translate(-1%, -1%); }  
  100% { transform: scale(1) translate(0, 0); }  
}  
.hero-kenburns { animation: kenburns 22s ease-in-out infinite; will-change: transform; }

/* Punto 1: niebla/partículas flotantes del hero */  
@keyframes mist-float {  
  0%   { transform: translate(0, 0) scale(1); opacity: 0.25; }  
  50%  { transform: translate(20px, -30px) scale(1.15); opacity: 0.45; }  
  100% { transform: translate(0, 0) scale(1); opacity: 0.25; }  
}  
.mist-dot { animation: mist-float 20s ease-in-out infinite; }

/* Punto 1: flores de mayo (orquídea andina) con respiración sutil */  
@keyframes flower-breathe {  
  0%, 100% { transform: scale(1) rotate(-3deg); opacity: 0.85; }  
  50%      { transform: scale(1.07) rotate(3deg); opacity: 1; }  
}  
.flower-sway { animation: flower-breathe 6s ease-in-out infinite; transform-origin: center; will-change: transform; }  
.flower-sway:nth-of-type(2) { animation-duration: 7.5s; animation-delay: 0.6s; }  
.flower-sway:nth-of-type(3) { animation-duration: 5.2s; animation-delay: 1.2s; }

@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }  
.animate-marquee { animation: marquee 28s linear infinite; width: max-content; }  
.marquee-viewport:hover .animate-marquee { animation-play-state: paused; }  
.marquee-viewport {  
  overflow: hidden;  
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);  
          mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);  
}

@media (prefers-reduced-motion: reduce) {  
  .veg-far, .veg-mid, .veg-front, .animate-marquee, .hero-kenburns, .mist-dot, .flower-sway { animation: none; }  
}

/* Las tasas las mantiene el admin en la tabla exchange_rates. Los valores de
   aquí son solo el respaldo si la consulta falla: en Venezuela una tasa
   desactualizada convierte un precio correcto en uno equivocado en días. */
let TASA_COP = 4000;
let TASA_VES = 40;
let TASA_EUR = 0.92; // EUR por 1 USD (aprox.)
let TASAS_ACTUALIZADAS = null;

async function cargarTasas(){
  const sb = window.__tgSupabase;
  if(!sb) return;
  const { data, error } = await sb.from("exchange_rates").select("moneda, valor, actualizado_en");
  if(error || !data) return;
  data.forEach(r => {
    if(r.moneda === "COP") TASA_COP = Number(r.valor);
    if(r.moneda === "VES") TASA_VES = Number(r.valor);
    if(r.moneda === "EUR") TASA_EUR = Number(r.valor);
    if(!TASAS_ACTUALIZADAS || r.actualizado_en > TASAS_ACTUALIZADAS) TASAS_ACTUALIZADAS = r.actualizado_en;
  });
}

function money(n, currency) {
  if (currency === "COP") return `$${Math.round(n * TASA_COP).toLocaleString("es-CO")} COP`;
  if (currency === "VES") return `Bs. ${Math.round(n * TASA_VES).toLocaleString("es-VE")}`;
  if (currency === "EUR") return `€${(n * TASA_EUR).toFixed(0)}`;
  return `$${n.toFixed(2)} USD`;
}

/* El viajero paga en la moneda que tenga a mano. Mostrar las tres juntas
   evita la pregunta "¿y eso cuánto es en bolívares?" que hoy llega por
   WhatsApp en cada reserva. */

const ESTADOS = {

function fechaLarga(iso){
  if(!iso) return "—";
  const d = new Date(iso.length <= 10 ? iso + "T12:00:00" : iso);
  return d.toLocaleDateString("es-VE", { day: "2-digit", month: "long", year: "numeric" });
}

/* Pide el envío del voucher por correo. Que falle no invalida la reserva:
   ya está registrada y el viajero tiene su código en pantalla. */
async function enviarVoucherPorCorreo(codigo){
  try {
    await fetch(SUPABASE_URL + "/functions/v1/enviar-voucher", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ codigo })
    });
  } catch (e) {
    console.warn("No se pudo enviar el voucher por correo:", e);
  }
}

/* Sube el comprobante al bucket privado. Devuelve la ruta interna: la ve el
   admin con un enlace firmado, nunca queda pública. */
async function subirComprobante(archivo, prefijo){
  const sb = window.__tgSupabase;
  if(!archivo) throw new Error("Adjunta el comprobante de tu pago.");
  if(archivo.size > 5 * 1024 * 1024) throw new Error("El comprobante no puede pesar más de 5 MB.");
  const ext = (archivo.name.split(".").pop() || "jpg").toLowerCase();
  if(!["jpg","jpeg","png","pdf","webp"].includes(ext)) throw new Error("El comprobante debe ser una imagen o un PDF.");
  const ruta = `${prefijo}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from("comprobantes").upload(ruta, archivo);
  if(error) throw new Error("No se pudo subir el comprobante: " + error.message);
  return ruta;
}

function ChatPanel({ codigo, verificacion }) {
  const [mensajes, setMensajes] = useState([]);
  const [texto, setTexto] = useState("");
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [enviando, setEnviando] = useState(false);
  const finRef = useRef(null);

  const cargar = async () => {
    const sb = window.__tgSupabase;
    const { data, error } = await sb.rpc("abrir_conversacion", {
      p_codigo: codigo, p_verificacion: verificacion });
    setCargando(false);
    if(error){ setError(error.message); return; }
    setMensajes((data && data.mensajes) || []);
  };

  useEffect(() => { cargar(); }, [codigo]);
  useEffect(() => { if(finRef.current) finRef.current.scrollIntoView({ block: "nearest" }); }, [mensajes]);

  const enviar = async () => {
    const cuerpo = texto.trim();
    if(!cuerpo || enviando) return;
    setEnviando(true); setError("");
    const sb = window.__tgSupabase;
    const { data, error } = await sb.rpc("enviar_mensaje_cliente", {
      p_codigo: codigo, p_verificacion: verificacion, p_cuerpo: cuerpo });
    setEnviando(false);
    if(error){ setError(error.message); return; }
    setTexto("");
    setMensajes((data && data.mensajes) || []);
  };

  return React.createElement("div", { className: "border border-slate-200 rounded-xl overflow-hidden bg-white" },
    React.createElement("div", { className: "bg-slate-50 border-b border-slate-200 px-4 py-2.5 flex items-center justify-between" },
      React.createElement("p", { className: "text-sm font-bold text-slate-800" }, "Chat con el proveedor"),
      React.createElement("button", { onClick: cargar, className: "text-xs text-[#0052CC] font-semibold hover:underline" }, "Actualizar")),
    React.createElement("div", { className: "h-64 overflow-y-auto p-4 space-y-2.5 bg-slate-50/40" },
      cargando ? React.createElement("p", { className: "text-sm text-slate-400" }, "Cargando…")
      : mensajes.length === 0 ? React.createElement("p", { className: "text-sm text-slate-400 text-center mt-16" },
          "Todavía no hay mensajes. Escribe tu pregunta y el proveedor la verá en su panel.")
      : mensajes.map((m, i) => React.createElement("div", {
          key: i,
          className: `flex ${m.autor === "cliente" ? "justify-end" : "justify-start"}` },
          React.createElement("div", {
            style: { maxWidth: "78%" },
            className: `rounded-2xl px-3.5 py-2 text-sm ${
              m.autor === "cliente" ? "bg-[#0052CC] text-white"
              : m.autor === "admin" ? "bg-amber-100 text-amber-900"
              : "bg-white border border-slate-200 text-slate-700"}` },
            m.autor !== "cliente" ? React.createElement("p", {
              className: "text-[10px] font-bold opacity-70 mb-0.5" },
              m.autor === "admin" ? "Táchira GOO!!!" : (m.autor_nombre || "Proveedor")) : null,
            React.createElement("p", { className: "whitespace-pre-wrap leading-relaxed" }, m.cuerpo),
            React.createElement("p", { className: `text-[10px] mt-1 ${m.autor === "cliente" ? "text-white/70" : "text-slate-400"}` },
              new Date(m.created_at).toLocaleString("es-VE", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }))))),
      React.createElement("div", { ref: finRef })),
    error ? React.createElement("p", { className: "text-xs text-red-600 px-4 pb-1" }, error) : null,
    React.createElement("div", { className: "flex gap-2 p-3 border-t border-slate-200" },
      React.createElement("input", {

        className: "flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0052CC]" }),
      React.createElement("button", {

        className: "bg-[#0052CC] hover:bg-[#0043A8] disabled:bg-slate-200 text-white text-sm font-bold px-4 rounded-lg" },
        enviando ? "…" : "Enviar")));

/* ==========================================================================
   CARGA DEL CATÁLOGO REAL
   Traduce lo que publican los proveedores en Supabase al formato que ya usan
   las tarjetas, para no tener dos maneras distintas de pintar lo mismo.
   ========================================================================== */
const SUPABASE_URL = 'https://vkgxvckooykxfulclodj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LVIRh3oSFP7gGSkQuCnBdg_eZ2SAB8g';
window.__tgSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* El proveedor escribe el municipio a mano, así que llegan "cordoba",
   "ANDRES BELLO" o "San Cristóbal". El filtro del cliente compara contra la
   lista oficial, y sin normalizar nunca coincidirían. Lo llevamos al nombre
   canónico al cargar, para que filtro y tarjeta hablen el mismo idioma. */
function normalizaTexto(s){
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().trim();
}
const MUNICIPIOS_POR_CLAVE = MUNICIPIOS.reduce((acc, m) => {
  acc[normalizaTexto(m)] = m;
  return acc;
}, {});
function municipioCanonico(valor){
  return MUNICIPIOS_POR_CLAVE[normalizaTexto(valor)] || valor;
}

/* Un listado incompleto se ve peor que no verse: sin foto o sin precio la
   tarjeta queda rota y el viajero desconfía. Se ocultan hasta completarse. */
function listadoCompleto(l){
  const p = l.providers;
  return !!(p && p.business_name && p.municipio &&
    l.title && l.description && l.municipio &&
    l.base_price != null && l.cover_image_url);
}

async function cargarCatalogoReal(){
  const sb = window.__tgSupabase;

  const { data: listados, error } = await sb
    .from('listings')
    .select('*, providers(*)')
    .eq('status', 'published');

  if (error) {
    console.error('Error cargando el catálogo:', error.message);
    return;
  }

  const validos = (listados || []).filter(listadoCompleto);

  /* Puntuaciones reales. Sin reseñas la tarjeta no inventa estrellas. */
  const porListado = {};
  if (validos.length) {
    const { data: resenas } = await sb
      .from('reviews')
      .select('listing_id, rating')
      .in('listing_id', validos.map(l => l.id));
    (resenas || []).forEach(r => {
      const acc = porListado[r.listing_id] || (porListado[r.listing_id] = { suma: 0, n: 0 });
      acc.suma += r.rating; acc.n += 1;
    });
  }
  const puntuacion = id => {
    const a = porListado[id];
    return a && a.n ? { rating: Math.round((a.suma / a.n) * 10) / 10, reviews: a.n }
                    : { rating: null, reviews: 0 };
  };

  const experiencias = [];
  validos.forEach(l => {
    const { rating, reviews } = puntuacion(l.id);
    if (l.category === 'alojamiento') {
      ALOJAMIENTOS.push({
        id: l.id,
        titulo: l.title,
        municipio: municipioCanonico(l.municipio),
        tipo: 'alojamiento',
        imgs: [l.cover_image_url],
        proveedor: (l.providers && l.providers.business_name) || null,
        precioNocheUSD: Number(l.base_price),
        rating, reviews,
        limpiezaUSD: 0,
        providerId: l.provider_id,
        isVip: false,
        ventas: 0,
        descripcion: l.description,
        direccion: l.address || null,
        lat: l.lat, lng: l.lng,
        cancelacion: l.cancellation_policy || null
      });
    } else {
      experiencias.push({
        id: l.id,
        title: l.title,
        duration: l.max_capacity ? `Hasta ${l.max_capacity} personas` : 'Consulta disponibilidad',
        rating, reviews,
        priceCOP: Number(l.base_price) * TASA_COP,  // las tarjetas trabajan en COP
        img: l.cover_image_url,
        proveedor: (l.providers && l.providers.business_name) || null,
        municipio: municipioCanonico(l.municipio),
        providerId: l.provider_id,
        isVip: false,
        ventas: 0,
        descripcion: l.description,
        direccion: l.address || null,
        lat: l.lat, lng: l.lng,
        cancelacion: l.cancellation_policy || null
      });
    }
  });
  CARDS_BY_CATEGORY.experiencias = experiencias;

  /* Micrositios: solo de proveedores que el administrador ya verificó. */
  const aprobados = new Map();
  validos.forEach(l => {
    const p = l.providers;
    if (p && p.verification_status === 'approved' && !aprobados.has(p.id)) aprobados.set(p.id, p);
  });
  /* Un hotel vende habitaciones, no listados. Sin esto se quedaba sin
     micrositio por no tener ningún listing publicado. */
  const { data: aprobadosHotel } = await sb.from('providers').select('*')
    .eq('verification_status', 'approved').eq('business_type', 'hotel');
  (aprobadosHotel || []).forEach(p => { if (!aprobados.has(p.id)) aprobados.set(p.id, p); });
  aprobados.forEach(p => {
    ELITE_PROVIDERS.push({
      id: p.id,
      slug: p.slug || null,
      logo: p.logo_url || null,
      portada: p.cover_image_url || null,
      tipoNegocio: p.business_type || 'otro',
      /* El nombre es el del negocio; el título de portada es su lema y va
         en el encabezado grande, no sustituyendo a la marca. */
      nombre: p.business_name,
      acento: '#0052CC',
      especialidad: p.cover_tagline || 'Proveedor verificado',
      ubicacion: municipioCanonico(p.municipio),
      tagline: p.cover_title || p.cover_tagline || '',
      /* Lo que el negocio configura de su propia página. */
      tema: p.tema || 'clasico',
      seccionesOcultas: p.secciones_ocultas || [],
      lema: p.lema || p.cover_tagline || '',
      historia: p.historia || '',
      queHacemos: p.que_hacemos || '',
      anioFundacion: p.anio_fundacion || null,
      direccion: p.direccion || null,
      lat: p.lat, lng: p.lng,
      rating: null,
      reviews: 0,
      aniosOperando: null,
      about: p.about || '',
      whatsapp: p.whatsapp || null
    });
  });

  /* Hoteles: se cargan con sus tipos de habitación publicados. Un hotel sin
     habitaciones no tiene nada que vender, así que no se muestra. */
  const { data: hoteles, error: errHot } = await sb
    .from('providers')
    .select('*, room_types(*)')
    .eq('business_type', 'hotel')
    .eq('verification_status', 'approved');
  if (errHot) console.error('Error cargando hoteles:', errHot.message);
  (hoteles || []).forEach(hp => {
    const habitaciones = (hp.room_types || []).filter(t => t.status === 'published');
    if (!habitaciones.length) return;
    HOTELES.push({
      id: hp.id,
      nombre: hp.business_name,
      slug: hp.slug,
      municipio: municipioCanonico(hp.municipio),
      logo: hp.logo_url,
      portada: hp.cover_image_url,
      about: hp.about || '',
      habitaciones,
      desde: Math.min.apply(null, habitaciones.map(t => Number(t.precio_base)))
    });
  });

  /* Vehículos: vertical aparte. Solo los publicados con las dos revisiones
     aprobadas; la base de datos ya lo exige, lo repetimos por claridad. */
  const { data: vehiculos, error: errVeh } = await sb
    .from('vehicles').select('*').eq('status','published').eq('is_approved', true);
  if (errVeh) console.error('Error cargando vehículos:', errVeh.message);
  (vehiculos || []).forEach(v => VEHICULOS.push(Object.assign({}, v, { municipio: municipioCanonico(v.municipio) })));

  /* ------------------------------------------------------------------
     El micrositio se arma con lo que el negocio publicó de verdad: sus
     fotos, sus precios, sus productos. Antes esperaba campos del catálogo
     de ejemplo (cifras de viajeros atendidos, galería fija) que ningún
     proveedor real tiene, y la página se quedaba en blanco.
     ------------------------------------------------------------------ */
  ELITE_PROVIDERS.forEach(prov => {
    const susTours  = experiencias.filter(t => t.providerId === prov.id);
    const susAloj   = ALOJAMIENTOS.filter(a => a.providerId === prov.id);
    const suHotel   = HOTELES.find(h => h.id === prov.id);
    const susAutos  = VEHICULOS.filter(v => v.provider_id === prov.id);
    const habitaciones = suHotel ? suHotel.habitaciones : [];

    prov.foto = prov.portada;
    prov.bio  = prov.about;

    /* Galería: las portadas de todo lo que vende, sin repetir. */
    prov.gallery = Array.from(new Set([].concat(
      prov.portada ? [prov.portada] : [],
      habitaciones.map(h => h.cover_image_url),
      susTours.map(t => t.img),
      susAloj.map(a => a.imgs && a.imgs[0]),
      susAutos.map(v => v.cover_image_url)
    ).filter(Boolean)));

    const precios = [].concat(
      habitaciones.map(h => Number(h.precio_base)),
      susTours.map(t => t.priceCOP / TASA_COP),
      susAloj.map(a => Number(a.precioNocheUSD)),
      susAutos.map(v => Number(v.price_per_day))
    ).filter(n => Number.isFinite(n) && n > 0);
    prov.precioDesdeUSD = precios.length ? Math.round(Math.min.apply(null, precios)) : null;

    /* Producto destacado: el más barato, que es el que mejor engancha. */
    if (susTours.length) {
      const barato = susTours.reduce((a, b) => a.priceCOP <= b.priceCOP ? a : b);
      prov.featured = { type: 'tour', id: barato.id };
    } else if (susAloj.length) {
      prov.featured = { type: 'alojamiento', id: susAloj[0].id };
    } else {
      prov.featured = null;
    }

    prov.quickPitch = susTours.slice(0, 4).map(t => ({
      targetType: 'tour', targetId: t.id, icon: Compass,
      que: t.title, duracion: t.duration,
      precioUSD: Math.round(t.priceCOP / TASA_COP)
    }));

    /* Cifras reales. Si un dato no existe, no se inventa: se omite. */
    prov.stats = [
      habitaciones.length
        ? { value: String(habitaciones.reduce((n, h) => n + Number(h.cantidad_total || 0), 0)),
            label: habitaciones.length === 1 ? 'Habitación disponible' : 'Habitaciones disponibles' }
        : null,
      (susTours.length + susAloj.length)
        ? { value: String(susTours.length + susAloj.length), label: 'Experiencias publicadas' }

      susAutos.length
        ? { value: String(susAutos.length),
            label: susAutos.length === 1 ? 'Vehículo en alquiler' : 'Vehículos en alquiler' }
        : null,
      { value: prov.ubicacion, label: 'Municipio' }
    ].filter(Boolean).slice(0, 3);
  });

  console.info(`Catálogo real: ${experiencias.length} experiencias, ${ALOJAMIENTOS.length} alojamientos, ${ELITE_PROVIDERS.length} micrositios.`);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
