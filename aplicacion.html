/* ============================================================  
   FIX CRÍTICO MÓVIL: evita el desbordamiento horizontal de TODA  
   la página. Sin esto, cualquier elemento que exceda por unos  
   pocos píxeles el ancho del viewport (inputs de fecha, filas de  
   tabs, cards de ancho fijo, etc.) hace que el navegador permita  
   scrollear horizontalmente la página COMPLETA, cortando textos  
   y desalineando todo — exactamente el bug reportado.  
   ============================================================ */  
html, body {  
  max-width: 100%;  
  overflow-x: hidden;  
}  
#root {  
  overflow-x: hidden;  
  width: 100%;  
}  
* {  
  min-width: 0;  
}

html { scroll-behavior: smooth; }  
::-webkit-scrollbar { height: 8px; width: 8px; }  
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }  
.line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }  
.line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }  
/* Va sobre la foto de portada, así que ningún punto del degradado puede
   oscurecerse: el azul de marca se aclara a cielo y la sombra la dibuja un
   drop-shadow, porque con background-clip:text el text-shadow no se ve. */
.animated-gradient-text {
  background: linear-gradient(90deg, #FF8A3D, #8FC2FF, #FF8A3D);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 8px rgba(2,10,24,.92)) drop-shadow(0 4px 22px rgba(2,10,24,.6));
  animation: shine 3s linear infinite;
}  
@keyframes shine { to { background-position: -200% center; } }

@keyframes sway-soft {  
  0%,100% { transform: rotate(-1.2deg) translateX(0); }  
  50%     { transform: rotate(1.2deg) translateX(4px); }  
}  
@keyframes sway-medium {  
  0%,100% { transform: rotate(-2deg) translateX(-3px); }  
  50%     { transform: rotate(2.2deg) translateX(3px); }  
}  
@keyframes sway-strong {  
  0%,100% { transform: rotate(-2.8deg) skewX(-1deg); }  
  50%     { transform: rotate(2.8deg) skewX(1deg); }  
}  
.veg-far   { transform-origin: bottom center; animation: sway-soft 7s ease-in-out infinite; will-change: transform; }  
.veg-mid   { transform-origin: bottom center; animation: sway-medium 5.5s ease-in-out infinite; will-change: transform; }  
.veg-front { transform-origin: bottom center; animation: sway-strong 4.5s ease-in-out infinite; will-change: transform; }

@keyframes kenburns {  
  0%   { transform: scale(1) translate(0, 0); }  
  50%  { transform: scale(1.08) translate(-1%, -1%); }  
  100% { transform: scale(1) translate(0, 0); }  
}  
.hero-kenburns { animation: kenburns 22s ease-in-out infinite; will-change: transform; }

/* Punto 1: niebla/partículas flotantes del hero */  
@keyframes mist-float {  
  0%   { transform: translate(0, 0) scale(1); opacity: 0.25; }  
  50%  { transform: translate(20px, -30px) scale(1.15); opacity: 0.45; }  
  100% { transform: translate(0, 0) scale(1); opacity: 0.25; }  
}  
.mist-dot { animation: mist-float 20s ease-in-out infinite; }

/* Punto 1: flores de mayo (orquídea andina) con respiración sutil */  
@keyframes flower-breathe {  
  0%, 100% { transform: scale(1) rotate(-3deg); opacity: 0.85; }  
  50%      { transform: scale(1.07) rotate(3deg); opacity: 1; }  
}  
.flower-sway { animation: flower-breathe 6s ease-in-out infinite; transform-origin: center; will-change: transform; }  
.flower-sway:nth-of-type(2) { animation-duration: 7.5s; animation-delay: 0.6s; }  
.flower-sway:nth-of-type(3) { animation-duration: 5.2s; animation-delay: 1.2s; }

@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }  
.animate-marquee { animation: marquee 28s linear infinite; width: max-content; }  
.marquee-viewport:hover .animate-marquee { animation-play-state: paused; }  
.marquee-viewport {  
  overflow: hidden;  
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);  
          mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);  
}

@media (prefers-reduced-motion: reduce) {  
  .veg-far, .veg-mid, .veg-front, .animate-marquee, .hero-kenburns, .mist-dot, .flower-sway { animation: none; }  
}  

/* ============================================================
   CARCASA PREVIA (lo que se ve antes de que React monte)
   El contenido que leen los buscadores vive dentro de #root, así que
   mientras React no arranca es lo único en pantalla. Sin estilo se veía
   como un volcado de texto. Con esto, una conexión lenta muestra una
   página sencilla pero con la marca, y React la reemplaza al llegar.
   ============================================================ */
.ssr { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
       color: #0F172A; line-height: 1.65; }
.ssr__barra { background: #0052CC; color: #fff; padding: 18px 20px;
              border-bottom: 3px solid #FF6B00; }
.ssr__barra span { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.ssr__barra i { color: #FF6B00; font-style: normal; }
.ssr__cuerpo { max-width: 860px; margin: 0 auto; padding: 34px 20px 60px; }
.ssr h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; letter-spacing: -0.02em;
          line-height: 1.15; margin: 0 0 16px; }
.ssr h2 { font-size: 19px; font-weight: 700; margin: 34px 0 12px;
          padding-top: 22px; border-top: 1px solid #E2E8F0; }
.ssr p { margin: 0 0 14px; color: #475569; }
.ssr ul, .ssr ol { margin: 0 0 14px; padding-left: 20px; }
.ssr li { margin-bottom: 9px; color: #475569; }
.ssr li strong { color: #0F172A; }
.ssr a { color: #0052CC; }
.ssr nav { font-size: 13px; color: #64748B; margin-bottom: 14px; }

/* ==========================================================================
   CAPA DE ACABADO
   El esqueleto es Tailwind precompilado. En vez de tocar cada componente, se
   reafinan aquí los pocos valores que definen el carácter: la tipografía, la
   profundidad de las sombras, el papel sobre el que se apoya todo y el modo
   en que se pintan los botones. Es lo que separa un sitio plano de uno con
   materia.
   ========================================================================== */
:root{
  --tg-tinta:#0C1320;
  --tg-papel:#FBFAF8;
  --tg-azul:#0052CC;
  --tg-naranja:#FF6B00;
  --tg-linea:#E7E4DE;
  /* Portada. El velo va aquí para poder subirlo o bajarlo sin tocar el
     componente; hoy se mueve entre el 46% y el 58% de negro, que es lo que
     hace falta para leer blanco sobre el video sin apagarlo. */
  --tg-portada-acento:#FF9540;
  --tg-velo-alto:rgba(3,12,28,.58);
  --tg-velo-medio:rgba(3,12,28,.34);
  --tg-velo-bajo:rgba(3,12,28,.62);
  --tg-foco-centro:rgba(2,9,22,.46);
  --tg-foco-medio:rgba(2,9,22,.24);
}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--tg-papel);
  color:var(--tg-tinta);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"cv05" 1,"ss01" 1;
}
h1,h2,h3,.tg-display{ letter-spacing:-.023em; text-wrap:balance; }
h1{ letter-spacing:-.03em; }

/* La luz no cae plana: los botones tienen un gradiente mínimo y una sombra
   del color del propio botón, que es lo que les da cuerpo. */
.bg-\[\#FF6B00\]{
  background-image:linear-gradient(176deg,#FF8023 0%,#F76000 58%,#EC5A00 100%);
  box-shadow:0 1px 1px rgba(12,19,32,.06),0 10px 22px -10px rgba(236,90,0,.62);
}
.bg-\[\#FF6B00\]:hover{
  background-image:linear-gradient(176deg,#FF8A33 0%,#F56A08 58%,#E45700 100%);
  box-shadow:0 1px 1px rgba(12,19,32,.07),0 14px 28px -10px rgba(236,90,0,.72);
}
.bg-\[\#0052CC\]{
  background-image:linear-gradient(176deg,#0B61DC 0%,#0050C6 58%,#00429F 100%);
  box-shadow:0 1px 1px rgba(12,19,32,.06),0 10px 22px -11px rgba(0,66,159,.70);
}
.bg-\[\#0052CC\]:hover{
  background-image:linear-gradient(176deg,#1169E6 0%,#0057D2 58%,#004AB0 100%);
}
button{ transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s ease, background-color .16s ease; }
button:active{ transform:translateY(1px); }

/* Las tarjetas se separan por profundidad, no por línea. */
.border-slate-200{ border-color:var(--tg-linea); }
.border-slate-100{ border-color:#EFEDE8; }
.bg-slate-50{ background-color:#F5F3EF; }
.rounded-xl{ border-radius:15px; }
.rounded-2xl{ border-radius:20px; }
.shadow-xl{
  box-shadow:0 1px 2px rgba(12,19,32,.04),0 14px 32px -10px rgba(12,19,32,.14),
             0 44px 88px -40px rgba(12,19,32,.22);
}
.hover\:shadow-lg:hover{
  box-shadow:0 1px 2px rgba(12,19,32,.05),0 16px 32px -12px rgba(12,19,32,.20);
}
.shadow-lg{ box-shadow:0 1px 2px rgba(12,19,32,.05),0 14px 30px -12px rgba(12,19,32,.18); }

/* Las fotos de las tarjetas respiran un segundo al pasar por encima. */
.group:hover img, a:hover > div > img, article:hover img{ transform:scale(1.035); }
article img, .rounded-xl > div > img{ transition:transform .55s cubic-bezier(.2,.7,.3,1); }

/* Los números alineados en columna (precios, totales) con ancho fijo. */
.tg-cifras{ font-variant-numeric:tabular-nums; }

/* Foco visible: accesible sin ensuciar el diseño. */
:focus-visible{ outline:2px solid var(--tg-azul); outline-offset:2px; border-radius:6px; }

@media (prefers-reduced-motion: reduce){
  button, article img, .rounded-xl > div > img{ transition:none !important; transform:none !important; }
}


/* ==========================================================================

   La hoja de Tailwind viene precompilada de un escaneo que no cubrió todo el
   código. Ochenta y tantas clases se usaban sin existir: los "space-y" que

   ========================================================================== */

.mt-3\.5{margin-top:.875rem}.mt-12{margin-top:3rem}.mt-16{margin-top:4rem}

.leading-none{line-height:1}

/* ---- Mapa del Táchira ---------------------------------------------------
   Vive de noche: el estado iluminado sobre azul profundo, cada capital
   encendida y los puntos que tenemos brillando más que el resto.
   ------------------------------------------------------------------------ */
/* El titular. ANDES es la palabra que manda: va en grande, con el degradado
   en movimiento recortado sobre la letra. El relleno transparente se lleva
   por delante cualquier text-shadow, así que el despegue de la foto lo hace
   un drop-shadow sobre la forma de las letras. */
/* ---------------------------------------------------------------------
   PORTADA. El titular gigante se fue: ocupaba media pantalla y empujaba
   fuera lo único que la portada tiene que conseguir, que es que alguien
   elija por dónde empezar. Ahora la jerarquía es tipográfica —peso ligero
   para la frase, peso y color de marca para el nombre— y el aire lo pone
   el espacio, no el tamaño de la letra.
   --------------------------------------------------------------------- */
.tg-portada{position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;min-height:min(86vh,720px)}
.tg-portada-fondo{position:absolute;inset:0;overflow:hidden}
/* El poster se pinta de inmediato y el video se funde encima cuando puede
   reproducir. Así nunca hay un hueco negro esperando al video. */
.tg-portada-fondo img,.tg-portada-fondo video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tg-portada-fondo video{opacity:0;transition:opacity .7s ease}
.tg-portada-fondo video.tg-puesto{opacity:1}
@media(prefers-reduced-motion:reduce){.tg-portada-fondo video{transition:none}}

/* El velo. Dos capas: una vertical que asienta el conjunto y una elipse
   centrada donde cae el texto. Entre las dos, el contraste del titular
   sobre el video queda por encima de 7:1 sin apagar la imagen entera. */
.tg-portada-velo{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,
    var(--tg-velo-alto) 0%, var(--tg-velo-medio) 42%, var(--tg-velo-bajo) 100%)}
.tg-portada-foco{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(62% 52% at 50% 42%,
    var(--tg-foco-centro) 0%, var(--tg-foco-medio) 54%, transparent 80%)}

.tg-portada-cuerpo{position:relative;z-index:10;width:100%;max-width:1060px;
  margin:0 auto;padding:72px 20px;text-align:center}
@media(max-width:640px){.tg-portada-cuerpo{padding:52px 18px}}

.tg-ojo{margin:0 0 22px;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.3em;color:rgba(255,255,255,.82);
  text-shadow:0 1px 8px rgba(2,10,24,.9)}
@media(max-width:640px){.tg-ojo{letter-spacing:.2em;font-size:10px;margin-bottom:16px}}

/* Ligera y con aire: 300 de peso para la frase, que es donde estaba el
   exceso, y el nombre de la región en el acento de la marca. */
.tg-titulo{margin:0;font-size:clamp(27px,4.3vw,52px);font-weight:300;
  line-height:1.16;letter-spacing:-.022em;color:#fff;text-wrap:balance;
  max-width:19ch;margin-inline:auto;
  text-shadow:0 1px 10px rgba(2,10,24,.72),0 2px 30px rgba(2,10,24,.5)}
.tg-titulo b{font-weight:700;color:var(--tg-portada-acento);letter-spacing:-.028em}

.tg-bajada{margin:20px auto 0;max-width:56ch;font-size:clamp(14px,1.45vw,17px);
  font-weight:400;line-height:1.6;color:rgba(255,255,255,.9);
  text-shadow:0 1px 8px rgba(2,10,24,.85)}

.tg-pregunta{margin:40px 0 14px;font-size:clamp(14.5px,1.5vw,18px);font-weight:500;
  color:rgba(255,255,255,.95);text-shadow:0 1px 8px rgba(2,10,24,.85)}
@media(max-width:640px){.tg-pregunta{margin-top:30px}}

/* La franja de confianza vuelve a la portada. Antes era una banda blanca
   debajo, que cortaba la imagen en dos y pesaba más que lo que decía. */
.tg-promesas{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  column-gap:26px;row-gap:6px;margin-top:22px}
.tg-promesas span{position:relative;font-size:12.5px;font-weight:500;
  color:rgba(255,255,255,.88);white-space:nowrap;
  text-shadow:0 1px 7px rgba(2,10,24,.9)}
@media(min-width:641px){
  .tg-promesas span + span::before{content:'·';position:absolute;left:-15px;
    color:rgba(255,255,255,.45)}
}
@media(max-width:640px){
  .tg-promesas{column-gap:14px;row-gap:4px;margin-top:18px}
  .tg-promesas span{font-size:11.5px}
}

/* Los tres botones de la portada: son la acción principal de la página, así
   que se ven como botones y no como pestañas de un formulario. */
.tg-pilar{display:flex;align-items:center;justify-content:center;gap:8px;
  flex:1 1 0;min-width:0;padding:13px 10px;border-radius:14px;border:1.5px solid transparent;
  font-size:14px;font-weight:700;color:#334155;background:#F1F5F9;cursor:pointer;
  transition:background .16s,color .16s,border-color .16s,box-shadow .16s,transform .16s}
.tg-pilar:hover{background:#E2E8F0;color:#0F172A;transform:translateY(-1px)}
.tg-pilar:focus-visible{outline:none;box-shadow:0 0 0 3px #fff,0 0 0 5.5px #0052CC}
.tg-pilar[aria-selected="true"]{background:#0052CC;border-color:#0052CC;color:#fff;
  box-shadow:0 1px 2px rgba(12,19,32,.08),0 10px 22px -10px rgba(0,82,204,.75)}
.tg-pilar[aria-selected="true"]:hover{background:#0046AE;transform:translateY(-1px)}
.tg-pilar svg{flex-shrink:0}
@media(max-width:420px){.tg-pilar{font-size:13px;padding:12px 6px;gap:6px}}
@media(prefers-reduced-motion:reduce){.tg-pilar{transition:none}.tg-pilar:hover{transform:none}}

/* ==========================================================================
   LA TRANSICIÓN: LA PANTALLA SE DESFRAGMENTA
   No hay captura de la pantalla anterior —no se puede fotografiar el DOM—
   así que lo que se rompe es un velo con el color de la marca: 24 piezas
   que salen volando y vuelven a juntarse mostrando lo de debajo. Todo con
   transform y opacity, que es lo único que el navegador anima sin repintar.
   ========================================================================== */
.tg-fragmentos{position:fixed;inset:0;z-index:120;pointer-events:none;
  display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr)}
.tg-fragmentos i{display:block;background:var(--tg-azul);
  animation:tgPieza .72s cubic-bezier(.65,0,.35,1) forwards}
@keyframes tgPieza{
  0%{transform:none;opacity:1}
  42%{transform:none;opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4);opacity:0}
}
@media(prefers-reduced-motion:reduce){
  .tg-fragmentos i{animation:tgDesvanece .3s linear forwards}
  @keyframes tgDesvanece{to{opacity:0}}
}

/* ==========================================================================
   PANTALLA DE ELEGIR ZONA
   La misma para alojamiento y para experiencias: el escudo, el mapa de los
   tres estados y un buscador que va atado al mapa en los dos sentidos.
   ========================================================================== */
.tg-zona{position:fixed;inset:0;z-index:110;overflow-y:auto;background:#050D1E;
  background-image:radial-gradient(circle at 18% 10%,rgba(31,111,229,.26),transparent 54%),
                   radial-gradient(circle at 84% 82%,rgba(255,107,0,.16),transparent 50%)}
.tg-zona-in{max-width:1120px;margin:0 auto;padding:26px 20px 56px}

/* Las tasas las mantiene el admin en la tabla exchange_rates. Los valores de
   aquí son solo el respaldo si la consulta falla: en Venezuela una tasa
   desactualizada convierte un precio correcto en uno equivocado en días. */
let TASA_COP = 4000;
let TASA_VES = 40;
let TASA_EUR = 0.92; // EUR por 1 USD (aprox.)
let TASAS_ACTUALIZADAS = null;

/* La plataforma cobra un recargo sobre la tarifa del proveedor, y la base
   de datos lo aplica al reservar. Si el cliente mostrara la tarifa pelada,
   el viajero vería un número y se le cobraría otro. Se leen las mismas
   reglas que usa el servidor, y el precio se muestra ya con el recargo y
   desglosado: esconderlo es lo que genera el reclamo. */
let COMISIONES = {};

async function cargarComisiones(){
  const sb = window.__tgSupabase;
  if(!sb) return;
  const { data, error } = await sb.from("mkt_comisiones").select("*");
  if(error || !data) return;
  data.forEach(c => { COMISIONES[c.pilar] = c; });
}

function recargoDe(pilar, base, unidades){
  const c = COMISIONES[pilar];
  if(!c) return 0;
  const pct = Number(c.recargo_viajero_pct || 0);
  const seg = Number(c.recargo_seguro || 0) * (c.seguro_por_unidad ? Math.max(unidades || 1, 1) : 1);
  return Math.round((Number(base || 0) * pct / 100 + seg) * 100) / 100;
}

function totalViajero(pilar, base, unidades){
  return Math.round((Number(base || 0) + recargoDe(pilar, base, unidades)) * 100) / 100;
}

async function cargarTasas(){
  const sb = window.__tgSupabase;
  if(!sb) return;
  const { data, error } = await sb.from("exchange_rates").select("moneda, valor, actualizado_en");
  if(error || !data) return;
  data.forEach(r => {
    if(r.moneda === "COP") TASA_COP = Number(r.valor);
    if(r.moneda === "VES") TASA_VES = Number(r.valor);
    if(r.moneda === "EUR") TASA_EUR = Number(r.valor);
    if(!TASAS_ACTUALIZADAS || r.actualizado_en > TASAS_ACTUALIZADAS) TASAS_ACTUALIZADAS = r.actualizado_en;
  });
}

function estadoDelMunicipio(nombre){

const CIUDADES_PRINCIPALES = [

/* Lo que se marca siempre, pase lo que pase: por dónde se entra y se sale de
   los Andes. Lo demás —atractivos, centros históricos— vive en las capas,

const ICONO_AVION = "M21 15.5l-7.5-4.3V5.6c0-.9-.7-1.6-1.5-1.6s-1.5.7-1.5 1.6v5.6L3 15.5v1.8l7.5-2.2v4l-2.2 1.5v1.3l3.7-1 3.7 1v-1.3L13.5 19v-4l7.5 2.2v-1.8z";

  terminal:   { etiqueta: "Terminal terrestre", color: "#FFC98A" }

const claseEstado = id => "edo-" + id;

const MAPA_PATHS = ESTADOS_MAPA.flatMap(e => e.geo.map(m => ({
  n: m.n, cap: m.cap, estado: e.id,
  clave: e.id + ":" + m.n,
  cx: mx(m.cp[0]), cy: my(m.cp[1]),
  caja: [mx(m.b[0]), my(m.b[3]), mx(m.b[2]), my(m.b[1])],   // x0,y0,x1,y1
  d: m.r.map(r => "M" + r.map(p => mx(p[0]).toFixed(1) + " " + my(p[1]).toFixed(1)).join("L") + "Z").join(" ")
})));

const nombreEstado = id => (ESTADOS_MAPA.find(e => e.id === id) || {}).nombre || id;

/* Con teclado, 72 municipios serían 72 tabulaciones antes de llegar al
   buscador. Mientras no haya un estado elegido solo entra uno por estado:
   el primero de cada uno, que vale como «el estado». */
const PUERTA_DE_ESTADO = new Set(
  ESTADOS_MAPA.map(e => e.id + ":" + e.geo[0].n));

function cajaDeVarios(lista) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  lista.forEach(m => {
    x0 = Math.min(x0, m.caja[0]); y0 = Math.min(y0, m.caja[1]);
    x1 = Math.max(x1, m.caja[2]); y1 = Math.max(y1, m.caja[3]);
  });
  return [x0, y0, x1, y1];
}
/* El lienzo se adapta a la forma del municipio, pero dentro de un margen:
   un municipio tres veces más alto que ancho, encuadrado tal cual, deja el
   mapa convertido en una tira. Fuera de estos límites se rellena. */
const MAPA_RATIO_MIN = 0.58, MAPA_RATIO_MAX = 1.5;

function encuadrar(x0, y0, x1, y1, margen) {
  let w = (x1 - x0) + margen * 2, h = (y1 - y0) + margen * 2;
  if (w / h > MAPA_RATIO_MAX) h = w / MAPA_RATIO_MAX;
  else if (w / h < MAPA_RATIO_MIN) w = h * MAPA_RATIO_MIN;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return [cx - w / 2, cy - h / 2, w, h];
}

/* El estado solo, del tamaño que tenía el Táchira cuando era el único. */
function cajaDeEstado(id) {
  const suyos = MAPA_PATHS.filter(m => m.estado === id);
  if (!suyos.length) return VISTA_REGION;
  const [x0, y0, x1, y1] = cajaDeVarios(suyos);
  return encuadrar(x0, y0, x1, y1, 40);
}

function cajaDeMunicipio(clave) {
  const m = MAPA_PATHS.find(p => p.clave === clave);
  if (!m) return VISTA_REGION;
  const [x0, y0, x1, y1] = m.caja;
  /* El margen es corto a propósito: al elegir un municipio hay que quedar
     dentro de él, no mirándolo de lejos. */
  return encuadrar(x0, y0, x1, y1, Math.max(x1 - x0, y1 - y0) * 0.04 + 6);
}

/* Dónde se escribe el nombre de cada estado en la vista de región. */
const CENTRO_ESTADO = {};
ESTADOS_MAPA.forEach(e => {
  const suyos = MAPA_PATHS.filter(m => m.estado === e.id);
  let x = suyos.reduce((a, m) => a + m.cx, 0) / suyos.length;
  let y = suyos.reduce((a, m) => a + m.cy, 0) / suyos.length;
  /* En Trujillo la capital cae casi en el centro del estado y el nombre del
     estado se le montaba encima. Si están cerca, el rótulo se aparta por el
     lado contrario a la ciudad. */
  const c = CIUDADES_PRINCIPALES.find(c => c.estado === e.id);
  const [bx0, by0, bx1, by1] = cajaDeVarios(suyos);
  if (c) {
    const dx = x - mx(c.lng), dy = y - my(c.lat);
    const d = Math.hypot(dx, dy) || 1;
    const minimo = Math.min(bx1 - bx0, by1 - by0) * 0.3;
    if (d < minimo) {                       // lo aparto justo lo necesario
      x += dx / d * (minimo - d);
      y += dy / d * (minimo - d);
    }
  }
  /* Y que no se salga del estado: un rótulo flotando en el vecino confunde
     más que uno pegado a su capital. */
  const mx0 = (bx1 - bx0) * 0.16, my0 = (by1 - by0) * 0.16;
  CENTRO_ESTADO[e.id] = {
    x: Math.min(Math.max(x, bx0 + mx0), bx1 - mx0),
    y: Math.min(Math.max(y, by0 + my0), by1 - my0)
  };
});

/* Los dos estados juntos: es la primera vista, la de elegir a dónde vas. */
const VISTA_REGION = (() => {
  const [x0, y0, x1, y1] = cajaDeVarios(MAPA_PATHS);
  return encuadrar(x0, y0, x1, y1, 46);
})();

/* ---- El detalle, que no viaja con la página -----------------------------
   El contorno fino de los 29 municipios, los ríos y los 645 pueblos pesan
   300 KB: diez veces el mapa de la portada. Visto de lejos no se distinguen
   del dibujo estilizado, así que no se descargan hasta que alguien entra en
   un municipio; de ahí quedan en memoria y en la caché del navegador. */
const DETALLE = {};          // por estado: { porMun, pueblos, rios }
const DETALLE_PIDIENDO = {};

function unaLinea(puntos) {
  return "M" + puntos.map(p => mx(p[0]).toFixed(1) + " " + my(p[1]).toFixed(1)).join("L");
}

/* Un archivo por estado: quien solo mira el Táchira no descarga Mérida. */
function pedirDetalle(estado) {

/* ---- Paleta, tipografía y portada, cada una por su lado -----------------
   El tema de antes ataba colores, letra y forma en un solo paquete: quien
   quería el verde del Andino se llevaba su serifa de propina. Ahora las
   tres se eligen sueltas, y el catálogo vive en la base —tabla ms_estilos—
   para que el portal del proveedor y esta página pinten lo mismo sin que
   nadie tenga que desplegar dos veces.

   El tema sigue siendo el punto de partida: un negocio que nunca entró al
   personalizador se ve exactamente igual que antes. */
const ESTILOS = { paleta: {}, tipografia: {}, portada: {}, listas: { paleta: [], tipografia: [], portada: [] } };

function guardarEstilos(filas) {
  (filas || []).forEach(f => {
    if (!ESTILOS[f.tipo]) return;
    const e = Object.assign({ id: f.id, nombre: f.nombre, resumen: f.resumen }, f.valores || {});
    ESTILOS[f.tipo][f.id] = e;
    ESTILOS.listas[f.tipo].push(e);
  });
  pedirLetras();
}

/* Las fuentes de Google solo se piden si alguna página las usa de verdad. */
const LETRAS_PEDIDAS = new Set();
function pedirLetras() {
  const familias = [];
  ESTILOS.listas.tipografia.forEach(t => (t.web || []).forEach(w => {
    if (!LETRAS_PEDIDAS.has(w)) { LETRAS_PEDIDAS.add(w); familias.push(w); }
  }));
  if (!familias.length) return;
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?" + familias.map(f => "family=" + f).join("&") + "&display=swap";
  document.head.appendChild(l);
}

function temaDe(p){
  const base = TEMAS[(p && p.tema) || "clasico"] || TEMAS.clasico;
  const pal = p && p.paleta && ESTILOS.paleta[p.paleta];
  const tip = p && p.tipografia && ESTILOS.tipografia[p.tipografia];
  const por = p && p.plantillaPortada && ESTILOS.portada[p.plantillaPortada];
  if (!pal && !tip && !por) return base;
  const t = Object.assign({}, base);
  if (pal) Object.assign(t, {
    acento: pal.acento, acento2: pal.acento2, fondo: pal.fondo, suave: pal.suave,
    texto: pal.texto, tenue: pal.tenue, borde: pal.borde });
  if (tip) Object.assign(t, {
    titulo: tip.titulo, cuerpo: tip.cuerpo,
    tituloPeso: tip.peso, tituloEspaciado: tip.espaciado });
  if (por) Object.assign(t, {
    heroAlto: por.alto, heroAlineacion: por.alineacion,
    heroVelo: por.velo, heroForma: por.forma });
  return t;
}

/* Las secciones que el negocio puede quitar. La portada y su rubro principal
   no están aquí: son lo que vende, siempre van. */
const SECCIONES_MICROSITIO = [
  { id: "nosotros",  label: "Quiénes somos" },
  { id: "galeria",   label: "Galería de fotos" },
  { id: "catalogo",  label: "Resto del catálogo" },
  { id: "resenas",   label: "Reseñas" },
  { id: "ubicacion", label: "Cómo llegar" }
];

function seccionVisible(p, id){
  return !((p && p.seccionesOcultas) || []).includes(id);
}

/* El orden lo pone el dueño; lo que no haya nombrado va detrás, como
   estaba. Así una lista vieja o a medias nunca pierde una sección. */
function seccionesDe(p){
  const base = SECCIONES_MICROSITIO.map(x => x.id);
  const suyo = ((p && p.seccionesOrden) || []).filter(id => base.includes(id));
  return suyo.concat(base.filter(id => !suyo.includes(id)))
             .filter(id => seccionVisible(p, id));
}

/* Qué vende principalmente este negocio: es lo primero que ve el viajero. */
function rubroPrincipal(p){
  if (p.tipoNegocio === "hotel") return "habitaciones";
  if (p.tipoNegocio === "vehiculos") return "flota";
  return "experiencias";
}

  if(!iso) return "—";

/* Sube el comprobante al bucket privado. Devuelve la ruta interna: la ve el
   admin con un enlace firmado, nunca queda pública. */
async function subirComprobante(archivo, prefijo){
  const sb = window.__tgSupabase;
  if(!archivo) throw new Error("Adjunta el comprobante de tu pago.");
  if(archivo.size > 5 * 1024 * 1024) throw new Error("El comprobante no puede pesar más de 5 MB.");
  const ext = (archivo.name.split(".").pop() || "jpg").toLowerCase();
  if(!["jpg","jpeg","png","pdf","webp"].includes(ext)) throw new Error("El comprobante debe ser una imagen o un PDF.");
  const ruta = `${prefijo}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from("comprobantes").upload(ruta, archivo);
  if(error) throw new Error("No se pudo subir el comprobante: " + error.message);
  return ruta;
}

  /* Los municipios van de primeros: el menú de la barra los necesita para
     armarse, el cotizador necesita la coordenada de cada capital y el resto
     de la carga los usa para saber de qué estado es cada publicación.
     Antes se pedían al final y nada de eso podía apoyarse en ellos. */
  const { data: munis } = await sb.from('municipios')
    .select('id,estado,nombre,capital,lat,lng').order('nombre');
  (munis || []).forEach(m => {
    MUNICIPIOS_ANDES.push({
      id: m.id, estado: m.estado, nombre: m.nombre,
      capital: m.capital, lat: m.lat, lng: m.lng });
    if (m.lat == null || m.lng == null) return;
    SITIOS_TRASLADO.push({
      id: 'm:' + m.id, nombre: m.capital, tipo: 'pueblo',
      pie: m.nombre + ' · ' + m.estado, lat: m.lat, lng: m.lng });
  });
  SITIOS_TRASLADO.sort((a, b) => a.nombre.localeCompare(b.nombre));

  const { data: listados, error } = await sb
    .from('listings')
    .select('*, providers(*)')
    .eq('status', 'published');

  if (error) {
    console.error('Error cargando el catálogo:', error.message);
    return;
  }

  const validos = (listados || []).filter(listadoCompleto);

  /* Puntuaciones reales. Sin reseñas la tarjeta no inventa estrellas. */
  const porListado = {};
  if (validos.length) {
    const { data: resenas } = await sb
      .from('reviews')
      .select('listing_id, rating')
      .in('listing_id', validos.map(l => l.id));
    (resenas || []).forEach(r => {
      const acc = porListado[r.listing_id] || (porListado[r.listing_id] = { suma: 0, n: 0 });
      acc.suma += r.rating; acc.n += 1;
    });
  }
  const puntuacion = id => {
    const a = porListado[id];
    return a && a.n ? { rating: Math.round((a.suma / a.n) * 10) / 10, reviews: a.n }
                    : { rating: null, reviews: 0 };
  };

  const experiencias = [];
  validos.forEach(l => {
    const { rating, reviews } = puntuacion(l.id);
    if (l.category === 'alojamiento') {
      ALOJAMIENTOS.push({
        id: l.id,
        titulo: l.title,
        municipio: municipioCanonico(l.municipio),
        estado: estadoDeListado(l),
        tipo: 'alojamiento',
        imgs: [l.cover_image_url],
        proveedor: (l.providers && l.providers.business_name) || null,
        precioNocheUSD: Number(l.base_price),
        rating, reviews,
        limpiezaUSD: 0,
        providerId: l.provider_id,
        isVip: false,
        ventas: 0,
        descripcion: l.description,
        direccion: l.address || null,
        lat: l.lat, lng: l.lng,
        cancelacion: l.cancellation_policy || null
      });
    } else {
      experiencias.push({
        id: l.id,
        title: l.title,
        duration: l.max_capacity ? `Hasta ${l.max_capacity} personas` : 'Consulta disponibilidad',
        rating, reviews,
        priceCOP: Number(l.base_price) * TASA_COP,  // las tarjetas trabajan en COP
        precioUSD: Number(l.base_price),
        categoria: l.category,
        img: l.cover_image_url,
        proveedor: (l.providers && l.providers.business_name) || null,
        municipio: municipioCanonico(l.municipio),
        estado: estadoDeListado(l),
        destacadoRank: l.featured_rank == null ? null : Number(l.featured_rank),
        providerId: l.provider_id,
        isVip: false,
        ventas: 0,
        descripcion: l.description,
        direccion: l.address || null,
        lat: l.lat, lng: l.lng,
        cancelacion: l.cancellation_policy || null
      });
    }
  });
  CARDS_BY_CATEGORY.experiencias = experiencias;

  /* Micrositios: quién tiene página pública lo decide el servidor, no esta
     pantalla. La vista 'micrositios' ya cruza las tres condiciones —estar
     verificado, tener dirección propia y tener el módulo abierto— así que
     una operadora sin membresía no aparece aquí aunque esté aprobada. */
  const { data: paginas, error: errMs } = await sb.from('micrositios').select('*');
  if (errMs) console.error('Error cargando micrositios:', errMs.message);

  /* El catálogo de estilos viaja con los micrositios: si no hay ninguno,
     tampoco hace falta. Sin él, cada página se ve con su tema de siempre. */
  if ((paginas || []).length) {
    const { data: estilos, error: errEst } = await sb.from('ms_estilos')
      .select('tipo,id,nombre,resumen,valores,orden').order('tipo').order('orden');
    if (errEst) console.error('Error cargando estilos:', errEst.message);
    else guardarEstilos(estilos);
  }
  (paginas || []).forEach(p => {
    ELITE_PROVIDERS.push({
      id: p.id,
      slug: p.slug || null,
      logo: p.logo_url || null,
      portada: p.cover_image_url || null,
      tipoNegocio: p.business_type || 'otro',
      /* El nombre es el del negocio; el título de portada es su lema y va
         en el encabezado grande, no sustituyendo a la marca. */
      nombre: p.business_name,
      acento: '#0052CC',
      especialidad: p.cover_tagline || 'Proveedor verificado',
      ubicacion: municipioCanonico(p.municipio),
      tagline: p.cover_title || p.cover_tagline || '',
      /* Lo que el negocio configura de su propia página. */
      tema: p.tema || 'clasico',
      paleta: p.paleta || null,
      tipografia: p.tipografia || null,
      /* "portada" ya era la foto; la plantilla necesita su propio nombre. */
      plantillaPortada: p.portada || null,
      seccionesOcultas: p.secciones_ocultas || [],
      seccionesOrden: p.secciones_orden || null,
      lema: p.lema || p.cover_tagline || '',
      historia: p.historia || '',
      queHacemos: p.que_hacemos || '',
      anioFundacion: p.anio_fundacion || null,
      direccion: p.direccion || null,
      lat: p.lat, lng: p.lng,
      rating: null,
      reviews: 0,
      aniosOperando: null,
      about: p.about || '',
      whatsapp: p.whatsapp || null
    });
  });

  /* Hoteles: se cargan con sus tipos de habitación publicados. Un hotel sin
     habitaciones no tiene nada que vender, así que no se muestra. */
  const { data: hoteles, error: errHot } = await sb
    .from('providers')
    .select('*, room_types(*)')
    .eq('business_type', 'hotel')
    .eq('verification_status', 'approved');
  if (errHot) console.error('Error cargando hoteles:', errHot.message);
  (hoteles || []).forEach(hp => {
    const habitaciones = (hp.room_types || []).filter(t => t.status === 'published');
    if (!habitaciones.length) return;
    HOTELES.push({
      id: hp.id,
      nombre: hp.business_name,
      slug: hp.slug,
      municipio: municipioCanonico(hp.municipio),
      logo: hp.logo_url,
      portada: hp.cover_image_url,
      about: hp.about || '',
      lat: hp.lat, lng: hp.lng,
      habitaciones,
      desde: Math.min.apply(null, habitaciones.map(t => totalViajero("alojamiento", Number(t.precio_base), 1)))
    });
  });

  /* Vehículos: vertical aparte. Solo los publicados con las dos revisiones
     aprobadas; la base de datos ya lo exige, lo repetimos por claridad. */
  const { data: vehiculos, error: errVeh } = await sb
    .from('vehicles').select('*').eq('status','published').eq('is_approved', true);
  if (errVeh) console.error('Error cargando vehículos:', errVeh.message);
  (vehiculos || []).forEach(v => VEHICULOS.push(Object.assign({}, v, { municipio: municipioCanonico(v.municipio) })));

  /* Atracciones: no son productos nuestros, son los sitios del estado.
     Sirven para que el mapa tenga algo que mostrar desde el primer día y
     para que el viajero sepa qué hay cerca de donde va a dormir. */
  /* Los puntos de los tres estados. Antes esto pedía solo 'tachira-%': con
     el mapa ya en tres estados, los aeropuertos y terminales de Mérida y
     Trujillo existían en la base y no llegaban nunca a la pantalla. */
  /* Ranking del catálogo. Si falla, el catálogo sale igual: en el orden de
     siempre, sin destacados. Un error aquí no puede dejar la página vacía. */
  const { data: ranking, error: errRank } = await sb.from('catalogo_ranking').select('*');
  if (errRank) console.error('Error cargando el ranking:', errRank.message);
  (ranking || []).forEach(r => { RANKING[r.listing_id] = r; });

  const { data: puntos } = await sb.from('puntos_interes')
    .select('id,nombre,tipo,municipio_id,lat,lng')
    .eq('activo', true);
  const nombrePorId = {};
  ESTADOS_MAPA.forEach(e => e.geo.forEach(m => {
    const clave = e.id + '-' + m.n.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    nombrePorId[clave] = { nombre: m.n, estado: e.id };
  }));
  (puntos || []).forEach(p => {
    const m = nombrePorId[p.municipio_id];
    ATRACCIONES.push({
      id: p.id, nombre: p.nombre, tipo: p.tipo,
      municipio: m ? m.nombre : null, estado: m ? m.estado : null,
      lat: p.lat, lng: p.lng
    });
    /* Aeropuerto y terminal son justo de donde sale y a donde llega quien
       pide un traslado: entran al cotizador, y de primeros. */
    if (MAPA_SIEMPRE[p.tipo] && p.lat != null) {
      SITIOS_TRASLADO.unshift({
        id: 'p:' + p.id, nombre: p.nombre, tipo: p.tipo,
        pie: MAPA_SIEMPRE[p.tipo].etiqueta + (m ? ' · ' + m.nombre : ''),
        lat: p.lat, lng: p.lng });
    }
  });

  /* ------------------------------------------------------------------
     El micrositio se arma con lo que el negocio publicó de verdad: sus
     fotos, sus precios, sus productos. Antes esperaba campos del catálogo
     de ejemplo (cifras de viajeros atendidos, galería fija) que ningún
     proveedor real tiene, y la página se quedaba en blanco.
     ------------------------------------------------------------------ */
  ELITE_PROVIDERS.forEach(prov => {
    const susTours  = experiencias.filter(t => t.providerId === prov.id);
    const susAloj   = ALOJAMIENTOS.filter(a => a.providerId === prov.id);
    const suHotel   = HOTELES.find(h => h.id === prov.id);
    const susAutos  = VEHICULOS.filter(v => v.provider_id === prov.id);
    const habitaciones = suHotel ? suHotel.habitaciones : [];

    prov.foto = prov.portada;
    prov.bio  = prov.about;

    /* Galería: las portadas de todo lo que vende, sin repetir. */
    prov.gallery = Array.from(new Set([].concat(
      prov.portada ? [prov.portada] : [],
      habitaciones.map(h => h.cover_image_url),
      susTours.map(t => t.img),
      susAloj.map(a => a.imgs && a.imgs[0]),
      susAutos.map(v => v.cover_image_url)
    ).filter(Boolean)));

    const precios = [].concat(
      habitaciones.map(h => totalViajero("alojamiento", Number(h.precio_base), 1)),
      susTours.map(t => t.priceCOP / TASA_COP),
      susAloj.map(a => Number(a.precioNocheUSD)),
      susAutos.map(v => totalViajero("vehiculo", Number(v.price_per_day), 1))
    ).filter(n => Number.isFinite(n) && n > 0);
    prov.precioDesdeUSD = precios.length ? Math.round(Math.min.apply(null, precios)) : null;

    /* Producto destacado: el más barato, que es el que mejor engancha. */
    if (susTours.length) {
      const barato = susTours.reduce((a, b) => a.priceCOP <= b.priceCOP ? a : b);
      prov.featured = { type: 'tour', id: barato.id };
    } else if (susAloj.length) {
      prov.featured = { type: 'alojamiento', id: susAloj[0].id };
    } else {
      prov.featured = null;
    }

    prov.quickPitch = susTours.slice(0, 4).map(t => ({
      targetType: 'tour', targetId: t.id, icon: Compass,
      que: t.title, duracion: t.duration,
      precioUSD: Math.round(t.priceCOP / TASA_COP)
    }));

    /* Cifras reales. Si un dato no existe, no se inventa: se omite. */
    prov.stats = [
      habitaciones.length
        ? { value: String(habitaciones.reduce((n, h) => n + Number(h.cantidad_total || 0), 0)),
            label: habitaciones.length === 1 ? 'Habitación disponible' : 'Habitaciones disponibles' }
        : null,
      (susTours.length + susAloj.length)
        ? { value: String(susTours.length + susAloj.length), label: 'Experiencias publicadas' }
        : null,
      susAutos.length
        ? { value: String(susAutos.length),
            label: susAutos.length === 1 ? 'Vehículo en alquiler' : 'Vehículos en alquiler' }
        : null,
      { value: prov.ubicacion, label: 'Municipio' }
    ].filter(Boolean).slice(0, 3);
  });

  console.info(`Catálogo real: ${experiencias.length} experiencias, ${ALOJAMIENTOS.length} alojamientos, ${ELITE_PROVIDERS.length} micrositios.`);
}

const root = ReactDOM.createRoot(document.getElementById('root'));

/* El catálogo se llena con lo que publican los proveedores reales. Pedimos esos
   datos antes del primer render: si llegaran después, las secciones que calculan
   su contenido una sola vez se quedarían vacías para siempre. */
(async function arrancar(){
  /* Las tasas primero: el catálogo convierte precios al construirse, así que
     si llegaran después las tarjetas mostrarían la conversión anterior. */
  try { await cargarTasas(); } catch (e) { console.error('No se pudieron cargar las tasas:', e); }
  try { await cargarComisiones(); } catch (e) { console.error('No se pudieron cargar las comisiones:', e); }
  try { await cargarMetodosPago(); } catch (e) { console.error('No se pudieron cargar los métodos de pago:', e); }
  try {
    await cargarCatalogoReal();
  } catch (e) {
    console.error('No se pudo cargar el catálogo:', e);
  }
  root.render(React.createElement(App));

  /* La capa se va cuando la aplicación ya pintó su primer cuadro, no antes:
     si se quitara al llamar a render, se vería un parpadeo en blanco.

     Dos vías para pedirlo, porque requestAnimationFrame no corre en una
     pestaña que está en segundo plano: quien abre el sitio en otra pestaña
     y vuelve luego se encontraba el escudo todavía puesto. La primera que
     llegue lo quita; la función se protege de que la llamen dos veces. */
  var esperaFuera = false;
  function quitarEspera() {
    if (esperaFuera) return;
    esperaFuera = true;
    var e = document.getElementById('tg-espera');
    if (!e) { document.documentElement.classList.remove('tg-esperando'); return; }
    e.classList.add('se-va');
    setTimeout(function(){
      e.remove();
      document.documentElement.classList.remove('tg-esperando');
    }, 420);
  }
  requestAnimationFrame(function(){ requestAnimationFrame(quitarEspera); });
  setTimeout(quitarEspera, 400);
})();
</script>

<!-- El bloque de reserva de la antigua sección de proveedores se retiró:
     el catálogo principal ya registra las reservas en el checkout. -->
